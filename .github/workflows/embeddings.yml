name: Actualizar índice de búsqueda por significado

# Genera data/embeddings_{proyectos,otras}.{json,bin} a partir de data/proyectos.json
# (modelo intfloat/multilingual-e5-small). Es incremental: sólo recalcula los
# proyectos nuevos o modificados, así que después de la primera corrida tarda
# poco. Va aparte del workflow principal para no alargarlo (instalar el modelo
# pesa) y corre un rato después de la franja de la noche (22:00 ART).
on:
  schedule:
    # 23:30 Argentina (UTC-3) = 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyTorch versión CPU (mucho más liviana que la de GPU)
      - name: Instalar dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers numpy

      - name: Cache del modelo
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v1

      - name: Generar embeddings
        run: python scripts/generar_embeddings.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/embeddings_proyectos.json data/embeddings_proyectos.bin data/embeddings_otras.json data/embeddings_otras.bin
          if git diff --cached --quiet; then
            echo "Sin cambios; nada que commitear."
          else
            git commit -m "Índice de búsqueda por significado $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
